# Example only: adapt domain/cert paths; do not replace an existing nginx.conf.
# Put limit_req_zone once inside nginx's http {} block:
limit_req_zone $binary_remote_addr zone=thoughts_login:10m rate=10r/m;

server {
    listen 443 ssl;
    server_name YOUR_API_HOST;
    ssl_certificate /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    client_max_body_size 128k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /auth/login {
        access_log off;
        limit_req zone=thoughts_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host;
    }
}
