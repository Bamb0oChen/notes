# 先保守使用 MkDocs 内置扩展，保证通用 Markdown 可渲染
markdown_extensions:
  - toc:
      permalink: false
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - fenced_code
  - pymdownx.highlight:
      pygments_lang_class: true
      anchor_linenums: true
  - pymdownx.superfences
  # 让 $...$ / $$...$$ 进入数学渲染管线
  - pymdownx.arithmatex:
      generic: true
      block_syntax:
        - dollar
        - square
        - begin
