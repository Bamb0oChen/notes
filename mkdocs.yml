# MkDocs 配置：Material + 搜索 + docs/
# 不设置 nav，直接让 MkDocs 按 docs/ 的文件夹层级生成导航。

site_name: 移动的大图书馆
site_description: 记录计算机科学、自然科学、语言与生活的学习笔记和随想。
repo_url: https://github.com/Bamb0oChen/notes
repo_name: Bamb0oChen/notes

# GitHub Pages 仓库站点（repo pages）会部署在 /notes/ 子路径下。
# 不设置会导致某些模板（尤其是 404 页面）生成以 /assets 开头的绝对路径，线上会 404。
site_url: https://Bamb0oChen.com/notes/

# MkDocs 约定文档源目录为 docs/
docs_dir: docs

# 显式写出来，避免未来改动时产生不一致
use_directory_urls: true

# 空白占位页保留在源码中，写完后再从排除清单移除。
exclude_docs: |
  自然科学基础/数学基础/大一数学课/微积分（甲）/二元微积分/5.二类曲线积分和曲面积分.md
  自然科学基础/数学基础/大一数学课/概率论与数理统计/第9章 区间估计和假设检验.md
  计算机科学/ZJU HPC101/Lecture 7 CUDA基础.md
  计算机科学/ZJU HPC101/Lecture 8 机器学习基础.md
  计算机科学/ZJU HPC101/Lecture 9 机器学习高级话题.md
  计算机科学/ZJU HPC101/华为ICT架构学习.md

validation:
  links:
    anchors: warn

theme:
  name: material
  favicon: assets/images/patchouli-coding-bw-icon-mirrored.png
  language: zh
  custom_dir: overrides
  font: false
  features:
    # 一级目录显示为顶部导航；进入某个一级目录后，左侧栏显示其下级目录。
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
  # 深黑蓝底白字（默认使用深色方案）
  palette:
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色主题
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: 切换到深色主题

# 基础搜索（Material 会自动接入）
plugins:
  - search
  - rss:
      # 直接从 Git 历史识别新文章和更新，不增加 Markdown 写作配置。
      length: 30
      json_feed_enabled: false
      image: https://bamb0ochen.com/notes/assets/images/patchouli-coding-bw-icon-mirrored.png

# 随想在构建时从 Markdown 汇总，不需要运行后端。
hooks:
  - hooks/thoughts.py
  - hooks/top_nav.py
  - hooks/rss_meta.py
not_in_nav: |
  随想/*.md
  !随想/index.md

# 样式/脚本接口：把自定义文件放进 docs/assets/ 下，然后在这里引用
extra_css:
  - assets/stylesheets/intro.css
  - assets/stylesheets/thoughts.css
  - assets/fonts/source-han-sans.css
  - assets/stylesheets/extra.css
  - assets/stylesheets/backdrop.css
  - assets/stylesheets/local-ebooks.css

extra_javascript:
  - assets/javascripts/backdrop.js
  - assets/javascripts/visitors.js
  - assets/javascripts/local-ebooks.js
  # MathJax 配置在 extra.js 里，必须先于 MathJax 脚本加载
  - assets/javascripts/extra.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  # 只维护 headbar；每个栏目内部仍由 MkDocs 按 docs/ 文件夹自动生成。
  top_tabs:
    - index.md
    - 杂谈文章
    - 随想
    - 计算机科学
    - EE类
    - 语言
    - 杂项课程资料
    - 自然科学基础
    - 社会科学基础
  top_tab_labels:
    杂谈文章: 杂谈
  # 按此顺序展示精选阅读；path 为相对 docs/ 的 Markdown 路径。
  featured_reading:
    - path: 计算机科学/Cursh Course CS/计算机网络.md
      topic: 网络基础
    - path: 计算机科学/Cursh Course CS/虚拟内存与分页技术.md
      topic: 操作系统
    - path: 计算机科学/ZJU HPC101/Lecture 5 OpenMP.md
      topic: 并行计算
    - path: 计算机科学/苹果生态/iPhone安全设计.md
      topic: 苹果生态
  # 主图放到 docs/assets/images/，再填写相对 docs/ 的路径。
  # 例如 assets/images/notes-background.webp；留空不请求图片。
  notes_background: assets/images/notes-background-desktop-final.png
  notes_background_mobile: assets/images/notes-background-mobile.png
  notes_background_light: assets/images/notes-background-light-desktop.png
  notes_background_light_mobile: assets/images/notes-background-light-mobile.jpg
  giscus:
    enabled: true
    repo: Bamb0oChen/notes
    repo_id: R_kgDORKPyfQ
    category: Announcements
    category_id: DIC_kwDORKPyfc4C7H9I
    mapping: pathname
    strict: 0
    reactions_enabled: 1
    emit_metadata: 1
    input_position: top
    lang: zh-CN
    theme: dark

# 不写 nav：由 MkDocs 按 docs/ 下的真实文件夹自动生成导航。

# 先保守使用 MkDocs 内置扩展，保证通用 Markdown 可渲染
markdown_extensions:
  - toc:
      permalink: false
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - fenced_code
  - pymdownx.highlight:
      pygments_lang_class: true
      anchor_linenums: true
  - pymdownx.superfences
  # 让 $...$ / $$...$$ 进入数学渲染管线
  - pymdownx.arithmatex:
      generic: true
      block_syntax:
        - dollar
        - square
        - begin
