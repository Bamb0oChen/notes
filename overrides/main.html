{% extends "base.html" %}

{% block container %}
  <div class="notes-backdrop" aria-hidden="true">
    {% if config.extra.notes_background %}
      <picture>
        {% if config.extra.notes_background_mobile %}
          <source media="(max-width: 59.984375em)" srcset="{{ config.extra.notes_background_mobile | url }}">
        {% endif %}
        <img src="{{ config.extra.notes_background | url }}" alt="" decoding="async" fetchpriority="low">
      </picture>
    {% endif %}
  </div>
  {{ super() }}
{% endblock %}

{% block footer %}
  <div class="notes-visitors" aria-label="访问统计">
    <span id="busuanzi_container_site_uv" style="display:none">本站域名访客数 <strong id="busuanzi_value_site_uv"></strong></span>
    <span id="busuanzi_container_site_pv" style="display:none">总浏览量 <strong id="busuanzi_value_site_pv"></strong></span>
    <span id="busuanzi_container_page_pv" style="display:none">本页阅读量 <strong id="busuanzi_value_page_pv"></strong></span>
    <small>统计由 <a href="https://busuanzi.ibruce.info/" target="_blank" rel="noopener noreferrer">不蒜子</a> 提供（第三方访问统计）</small>
  </div>
  {{ super() }}
{% endblock %}
