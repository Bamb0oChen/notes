name: Thoughts API tests
on:
  push:
    paths: ["services/thoughts/**", ".github/workflows/thoughts-tests.yml"]
  pull_request:
    paths: ["services/thoughts/**", ".github/workflows/thoughts-tests.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/thoughts/requirements.txt pytest
      - run: python -m pytest services/thoughts/test_app.py -q
